name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci --omit=peer

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit and API tests
        run: npm test

      - name: PostgreSQL integration tests
        run: npm run test:integration

      - name: Production build
        run: npm run build

      - name: Built runtime validator rejects missing secrets
        env:
          NODE_ENV: production
          QUOTEPLATE_RUNTIME_STARTUP_CHECK: "1"
        run: |
          set -eu
          validation_log="$RUNNER_TEMP/quoteplate-runtime-validation.log"
          set +e
          NEXT_RUNTIME=nodejs node -e "require('./.next/server/instrumentation.js').register().catch((error) => { console.error(error.message); process.exit(1); })" > "$validation_log" 2>&1
          validation_status=$?
          set -e
          test "$validation_status" -ne 0
          grep -q 'Invalid production environment' "$validation_log"

      - name: Install bounded browser-test runtime
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y postgresql
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
          npx playwright install --with-deps chromium

      - name: Browser component regressions
        run: npm run test:components

      - name: Responsive end-to-end release tests
        run: npm run test:e2e

      - name: Block production dependency advisories
        run: npm audit --omit=dev --omit=peer --audit-level=high
